name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build CLI binaries
        run: make -j"$(nproc)"

      - name: Build test binary
        run: make -j"$(nproc)" gtest_all

      - name: Run tests
        run: make test
